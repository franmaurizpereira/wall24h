x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  image: wall24h-app:local

services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: wall_db
    environment:
      POSTGRES_DB: wall
      POSTGRES_USER: wall
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=wall
      - -c
      - timezone=UTC
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wall -d wall']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: postgres:16
    container_name: wall_migrate
    environment:
      DATABASE_URL: postgresql://wall:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/wall
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./db/migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
    entrypoint: ['/bin/bash', '/scripts/migrate.sh']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  migrate-test:
    image: postgres:16
    container_name: wall_migrate_test
    profiles: ['test']
    environment:
      DATABASE_URL: postgresql://wall:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/wall
      TEST_DATABASE_URL: postgresql://wall:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/wall_test
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./db/migrations:/migrations:ro
      - ./scripts/migrate-test.sh:/scripts/migrate-test.sh:ro
    entrypoint: ['/bin/bash', '/scripts/migrate-test.sh']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    <<: *app-build
    container_name: wall_app
    environment:
      DATABASE_URL: postgresql://wall:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/wall
      PORT: 3000
      NODE_ENV: development
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '${APP_PORT:-8080}:3000'
    restart: unless-stopped

  app-test:
    <<: *app-build
    container_name: wall_app_test
    profiles: ['test']
    environment:
      DATABASE_URL: postgresql://wall:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/wall_test
      PORT: 3000
      NODE_ENV: test
      COOKIE_SECRET: ${TEST_COOKIE_SECRET:?set TEST_COOKIE_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
    ports:
      - '${APP_TEST_PORT:-8081}:3000'
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: wall_caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  dbdata:
  caddy_data:
  caddy_config:
